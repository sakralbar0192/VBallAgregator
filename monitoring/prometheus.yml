# ============================================================================
# Prometheus Configuration for VBallAgregator
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vball-aggregator'
    environment: 'production'

# ============================================================================
# Alertmanager Configuration
# ============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ============================================================================
# Alert Rules
# ============================================================================
rule_files:
  - '/etc/prometheus/rules/*.yml'

# ============================================================================
# Scrape Configurations
# ============================================================================
scrape_configs:
  # ========================================================================
  # Prometheus Self-Monitoring
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ========================================================================
  # VBallAgregator Application
  # ========================================================================
  - job_name: 'vball-app'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'vball-app'
          instance: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # ========================================================================
  # PostgreSQL Database
  # ========================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          instance: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ========================================================================
  # Redis Cache
  # ========================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          instance: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ========================================================================
  # Node Exporter (System Metrics)
  # ========================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system'
          instance: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ========================================================================
  # Docker Daemon
  # ========================================================================
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
        labels:
          service: 'docker'
          instance: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # ========================================================================
  # Nginx
  # ========================================================================
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          instance: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
