name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma client
      run: npx prisma generate && node scripts/ensure-prisma-client-cjs.mjs
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    - name: Run linter
      run: npm run lint
    - name: TypeScript (noEmit)
      run: npm run typecheck

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma client
      run: npx prisma generate && node scripts/ensure-prisma-client-cjs.mjs
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    - name: TypeScript build
      run: npm run build
    - name: Verify worker bundles
      run: test -f dist/apps/outbox-publisher/index.js && test -f dist/apps/notification-worker/index.js && test -f dist/apps/scheduler-service/index.js

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate && node scripts/ensure-prisma-client-cjs.mjs
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

    - name: Run tests
      run: npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        # Не настоящий бот; тесты мокают Telegram. Для боевого деплоя используйте секреты окружения.
        TELEGRAM_BOT_TOKEN: '000000000:CI_DUMMY_TOKEN_NOT_FOR_PRODUCTION_USE'
        API_PORT: '3001'